name: Devcontainer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Registry Details
        id: registry_case
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('LOWERCASE_REPO', process.env.GITHUB_REPOSITORY.toLowerCase())

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build and Test in Devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ env.LOWERCASE_REPO }}/devcontainer
          push: filter
          cacheFrom: ghcr.io/${{ env.LOWERCASE_REPO }}/devcontainer
          
          runCmd: |
            source /opt/ros/jazzy/setup.bash
            
            export CCACHE_DIR=$PWD/.ccache
            export CCACHE_MAXSIZE=500M
            mkdir -p $CCACHE_DIR
            
            rm -rf build install log

            sudo chown -R $(whoami) .
            rosdep update
            
            rosdep install --from-paths . --ignore-src -y --rosdistro jazzy --skip-keys 'pcl xacro'
            find . -type d -name stonefish_vendor -exec touch {}/COLCON_IGNORE \;

            echo "Building workspace..."
            ccache -z
            
            colcon build --symlink-install --cmake-args -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            # Print ccache stats to verify hits
            ccache -s

            colcon test