velocity_control_layer:
    ros__parameters:
        SAVE_LOCATION: /home/jetson/okmr_auv/ros2_ws/src/okmr_controls/params/temp/velocity_control.yaml
        update_frequency: 100.0
        x_linear.p_gain: 2.0
        y_linear.p_gain: 0.5
        z_linear.p_gain: 2.0

        # Increased from 0.07-0.22: previously undertuned to fight the 57x velocity errors
        # from the degrees/radians bug. With correct radian inputs, 1.0 is appropriate.
        x_angular.p_gain: 1.0
        y_angular.p_gain: 1.0
        z_angular.p_gain: 1.0
