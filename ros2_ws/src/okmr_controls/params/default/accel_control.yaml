accel_control_layer:
    ros__parameters:
        SAVE_LOCATION: /home/jetson/okmr_auv/ros2_ws/src/okmr_controls/params/temp/accel_control.yaml
        update_frequency: 50.0

        # Feedforward Constants
        kbuoyancy: 0.07
        kdrag_x: 1.0
        kdrag_y: 0.0
        kdrag_yaw: 0.0
        kdrag_z: 0.0
        kmass_pitch: 0.12
        kmass_roll: 0.12
        kmass_x: 5.0
        kmass_y: 8.0
        kmass_yaw: 0.05

        # Linear Control
        x_linear.p_gain: 5.0
        x_linear.i_gain: 0.1
        x_linear.i_min: -20.0
        x_linear.i_max: 20.0
        x_linear.u_max: 100.0
        x_linear.u_min: -100.0
        x_linear.clamp_values: true

        y_linear.p_gain: 8.0
        y_linear.i_gain: 0.1
        y_linear.i_min: -20.0
        y_linear.i_max: 20.0
        y_linear.u_max: 100.0
        y_linear.u_min: -100.0
        y_linear.clamp_values: true

        z_linear.p_gain: 5.0
        z_linear.i_gain: 0.1
        z_linear.i_min: -20.0
        z_linear.i_max: 20.0
        z_linear.u_max: 100.0
        z_linear.u_min: -100.0
        z_linear.clamp_values: true

        # Angular Control
        x_angular.p_gain: 0.12
        x_angular.i_gain: 0.1
        x_angular.i_min: -5.0
        x_angular.i_max: 5.0
        x_angular.u_max: 20.0
        x_angular.u_min: -20.0
        x_angular.clamp_values: true

        y_angular.p_gain: 0.12
        y_angular.i_gain: 0.1
        y_angular.i_min: -5.0
        y_angular.i_max: 5.0
        y_angular.u_max: 20.0
        y_angular.u_min: -20.0
        y_angular.clamp_values: true

        z_angular.p_gain: 0.05
        z_angular.i_gain: 0.1
        z_angular.i_min: -5.0
        z_angular.i_max: 5.0
        z_angular.u_max: 20.0
        z_angular.u_min: -20.0
        z_angular.clamp_values: true
