pose_control_layer:
  ros__parameters:
    update_frequency: 100.0

    x_angular.p_gain: 0.5
    x_linear.p_gain: 0.75
    x_linear.u_max: 0.8
    x_linear.u_min: -0.2
    y_angular.p_gain: 2.0
    y_linear.p_gain: 0.35
    y_linear.u_max: 0.2
    y_linear.u_min: -0.2
    z_angular.p_gain: 0.3
    z_angular.i_gain: 0.15
    z_angular.i_min: -0.5
    z_angular.i_max: 0.5
    z_angular.d_gain: 0.05
    z_linear.p_gain: 2.0
    z_linear.u_max: 0.5 #max 0.5m/s setpoint
    z_linear.u_min: -0.5
    z_linear.clamp_values: true
    y_linear.clamp_values: true
    x_linear.clamp_values: true
