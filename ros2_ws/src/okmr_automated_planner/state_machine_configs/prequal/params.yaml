#in this file define the parameters that the state machines actually use
#ex. speed setpoints, confidence thresholds, etc
#root_path and base_config_path are defined inside the automated_planner.launch.py

automated_planner:
  ros__parameters:

    state_timeout_check_period: 0.1

    root:
      mission_altitude: 0.5 # Most likely is overridden by root

    qualifying:
      distance_forward: 13.0 # distance to gate = 3m, dist from gate to marker = 10m
      distance_down: 3.0
      distance_small: 0.5 # actually have no idea how large it will need to be
      turn: 90.0