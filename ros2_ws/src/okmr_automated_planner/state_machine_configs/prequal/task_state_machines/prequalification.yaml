qualifying:
  states:
    - { name: initializing }
    - { name: moving_small }
    - { name: moving_down }
    - { name: turn }
    - { name: surfacing }
    - { name: moving_forward_1, on_enter: 'on_enter_moving_forward'}
    - { name: moving_forward_2, on_enter: 'on_enter_moving_forward'}
    - { name: turn_1, on_enter: 'on_enter_turn'}
    - { name: turn_2, on_enter: 'on_enter_turn'}

  transitions:
    #- { trigger: initialized, source: initializing, dest: moving_down }
    #- { trigger: moving_down_done, source: moving_down, dest: moving_forward }
    - { trigger: initialized, source: initializing, dest: moving_forward_1 }
    - { trigger: moving_forward_done, source: moving_forward_1, dest: turn_1 }
    - { trigger: turn_done, source: turn_1, dest: moving_small }
    - { trigger: moving_small_done, source: moving_small, dest: turn_2 }
    - { trigger: turn_done, source: turn_2, dest: moving_forward_2 }
    - { trigger: moving_forward_done, source: moving_forward_2, dest: done }

