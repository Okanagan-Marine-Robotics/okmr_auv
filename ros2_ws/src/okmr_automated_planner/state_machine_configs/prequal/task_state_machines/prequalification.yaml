qualifying:
  states:
    - { name: moving_forward }
    - { name: moving_small }
    - { name: moving_down }
    - { name: turn }
    - { name: surfacing }

  transitions:
    - { trigger: initialized, source: initializing, dest: moving_down }
    - { trigger: moving_down_done, source: moving_down, dest: moving_forward }
    - { trigger: moving_forward_done, source: moving_forward, dest: turn }
    - { trigger: turn_done, source: turn, dest: moving_small }
    - { trigger: moving_small_done, source: moving_small, dest: turn }
    - { trigger: turn_done, source: turn, dest: moving_forward }
    - { trigger: moving_forward_done, source: moving_forward, dest: surfacing }
    - { trigger: surfacing_done, source: surfacing, dest: done }

