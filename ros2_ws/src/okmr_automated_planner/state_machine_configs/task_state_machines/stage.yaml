stage:
  states:
    - { name: initializing, timeout: 30} #if initialization is taking too long we should abort
    - { name: waiting_for_mission_start} 
    - { name: waiting }
    - { name: enabling_subsystems}
    - { name: sinking }

    - { name: stage_open }
    - { name: stage_open_done }
    - { name: stage_close }

    - { name: surfacing }
    - { name: done }

  transitions:
    - { trigger: initialized, source: initializing, dest: waiting_for_mission_start}
    - { trigger: mission_start_received, source: waiting_for_mission_start, dest: waiting }
    - { trigger: waiting_done, source: waiting, dest: enabling_subsystems }
    - { trigger: enabling_subsystems_done, source: enabling_subsystems, dest: sinking }
    - { trigger: sinking_done, source: sinking, dest: stage_open_done }

    - { trigger: stage_closing, source: stage_close, dest: surfacing }
    - { trigger: surfacing_done, source: surfacing, dest: done}

